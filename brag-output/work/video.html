const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);

// ---------- easing ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ei = (x) => x * x * x;
const back = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function mix(t, keys) { // keys: [[time, value], ...] eased in/out between keys
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
    const x = eio(P(t, t0, t1));
    return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], x)) : lerp(v0, v1, x);
  }
  return keys[keys.length - 1][1];
}
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------- narration / captions ----------
const VO = { hook: 0.2, reveal: 4.2, rules: 8.2, timeline: 14.2, live: 20.6, outro: 25.8 };
let SENT = []; // [{words:[{w,t,e}], a, b}]
async function loadNarration() {
  const n = await (await fetch("narration.json")).json();
  for (const line of n) {
    if (line.key === "outro") continue; // the outro's words are the big type itself
    const toks = line.text.split(/\s+/);
    const base = VO[line.key];
    let cur = [];
    line.words.forEach((wd, i) => {
      const tok = toks[i] ?? wd.w;
      cur.push({ w: tok, t: base + wd.t, e: base + wd.t + wd.d });
      if (/[.!?]$/.test(tok) || i === line.words.length - 1) { SENT.push({ words: cur }); cur = []; }
    });
  }
  // merge very short sentences with the next one in the same line? keep as spoken
  SENT.forEach((s, i) => {
    s.a = s.words[0].t - 0.12;
    const next = SENT[i + 1];
    s.b = Math.min(s.words[s.words.length - 1].e + 0.7, next ? next.words[0].t - 0.12 : 99);
  });
}
let capKey = -1;
function captions(t) {
  const i = SENT.findIndex((s) => t >= s.a && t < s.b);
  const cap = $("cap");
  if (i !== capKey) {
    capKey = i;
    cap.innerHTML = i < 0 ? "" : SENT[i].words.map((w) => `<span class="w">${w.w}</span>`).join(" ");
  }
  if (i < 0) return;
  const s = SENT[i];
  const k = eo(P(t, s.a, s.a + 0.22)), out = P(t, s.b - 0.18, s.b);
  cap.style.opacity = k * (1 - out);
  cap.style.transform = `translateY(${(1 - k) * 14}px)`;
  [...cap.children].forEach((el, j) => {
    const w = s.words[j];
    el.className = "w" + (t >= w.t ? (t < Math.max(w.e, w.t + 0.18) ? " on now" : " on") : "");
  });
}

// overlay cursor + ripple per window
function overlay(win) {
  const o = $(win).querySelector(".over");
  if (!o.firstChild) o.innerHTML = '<svg class="cursor" viewBox="0 0 26 34"><path d="M2 2 L2 27 L8.5 21 L13 31.5 L17.5 29.5 L13 19.5 L22 19.5 Z" fill="#f4f3ee" stroke="#0a0a0b" stroke-width="2" stroke-linejoin="round"/></svg><div class="ripple"></div>';
  return { cur: o.querySelector(".cursor"), rip: o.querySelector(".ripple") };
}
function cursorAt(win, t, path, clickT) { // path: [[t,[x,y]],...]
  const { cur, rip } = overlay(win);
  const [x, y] = mix(t, path);
  const vis = P(t, path[0][0] - 0.15, path[0][0] + 0.05) * (1 - P(t, path[path.length - 1][0] + 0.4, path[path.length - 1][0] + 0.6));
  const press = clickT != null ? 1 - 0.12 * Math.sin(Math.PI * P(t, clickT - 0.06, clickT + 0.12)) : 1;
  cur.style.opacity = vis; cur.style.transform = `translate(${x}px,${y}px) scale(${press})`;
  if (clickT != null) {
    const r = P(t, clickT, clickT + 0.5);
    rip.style.left = x + 2 + "px"; rip.style.top = y + 2 + "px";
    rip.style.opacity = r > 0 && r < 1 ? (1 - r) * vis : 0; rip.style.transform = `scale(${0.3 + r * 1.2})`;
  }
}

// ---------- window placement ----------
function place(el, { x = 0, y = 0, s = 1, rx = 0, ry = 0, rz = 0, o = 1, blur = 0 }) {
  el.style.transform = `translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;

  await Promise.all([...document.querySelectorAll("iframe")].map((f) => new Promise((r) => (f.contentDocument?.readyState === "complete" && f.contentDocument.querySelector(".list, .card") ? r() : f.addEventListener("load", r)))));
  await Promise.all([...document.querySelectorAll("iframe")].map((f) => f.contentDocument.fonts.ready));
  await document.fonts.load("600 100px 'Clash Display'"); await document.fonts.load("500 40px Satoshi"); await document.fonts.load("700 21px Satoshi");
  await document.fonts.ready;
  await Promise.all([...document.images].map((i) => i.decode()));
  await loadNarration();
  prepFeed(); prepTl(); prepFold();
  renderAt(0);
  return true;
})();
