<style>
  body { background: #060607; padding: 56px 24px 120px; }
  .head { max-width: 1400px; margin: 0 auto 56px; }
  .head h1 { font-size: clamp(40px, 6vw, 84px); letter-spacing: -.025em; }
  .head p { color: var(--text-2); margin-top: 12px; max-width: 60ch; }
  .group-h { max-width: 1400px; margin: 72px auto 24px; font-family: var(--font-body); font-variant-numeric: tabular-nums; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); }
  .gallery { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px 36px; }
  figure { width: 300px; }
  figcaption { margin-top: 16px; font-family: var(--font-display); font-size: 18px; }
  figcaption small { display: block; font-family: var(--font-body); font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

  .ph { width: 300px; height: 620px; border-radius: 28px; border: 7px solid #1d1d21; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 1px var(--line-2), 0 40px 80px rgba(0,0,0,.5); transition: transform .5s var(--ease-out); position: relative; }
  figure:hover .ph { transform: translateY(-8px); }
  .sb { height: 28px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 11px; font-family: var(--font-body); font-variant-numeric: tabular-nums; color: var(--text-2); flex: none; }
  .appbar { padding: 6px 18px 10px; display: flex; align-items: center; gap: 10px; flex: none; }
  .appbar h3 { font-size: 26px; flex: 1; }
  .appbar .ib { width: 34px; height: 34px; border-radius: 8px; background: var(--surface); display: grid; place-items: center; font-size: 14px; }
  .body { flex: 1; overflow: hidden; padding: 0 14px; position: relative; }
  .tabbar { height: 62px; flex: none; border-top: 1px solid var(--line); background: var(--bg-2); display: flex; justify-content: space-around; align-items: center; font-size: 10px; color: var(--text-3); }
  .tabbar div { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 50px; }
  .tabbar div span { font-size: 17px; padding: 3px 14px; border-radius: 6px; }
  .tabbar .on { color: var(--text); }
  .tabbar .on span { background: rgba(200,255,61,.16); color: var(--signal); }
  .m-row { display: flex; gap: 10px; padding: 11px 4px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .m-row .avatar { width: 34px; height: 34px; border-radius: 7px; font-size: 14px; }
  .m-row .t { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
  .m-row .s { color: var(--text-2); font-size: 12.5px; line-height: 1.35; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .m-row .tm { margin-left: auto; font-size: 10.5px; color: var(--text-3); font-family: var(--font-body); font-variant-numeric: tabular-nums; flex: none; }
  .seg { display: flex; gap: 6px; overflow: hidden; margin-bottom: 8px; }
  .seg .chip { height: 26px; font-size: 11.5px; padding: 0 10px; flex: none; }
  .fab { position: absolute; right: 16px; bottom: 16px; width: 52px; height: 52px; border-radius: 10px; background: var(--signal); color: var(--signal-ink); display: grid; place-items: center; font-size: 22px; font-weight: 700; box-shadow: 0 10px 30px rgba(200,255,61,.25); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 14px 14px 0 0; background: var(--surface); border-top: 1px solid var(--line-2); padding: 14px 18px 20px; }
  .sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 0 auto 14px; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .big-t { font-family: var(--font-display); font-size: 30px; line-height: 1.02; letter-spacing: -.015em; }
  .s-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .s-row small { display: block; color: var(--text-3); font-size: 11.5px; }
  .s-row .toggle { margin-left: auto; transform: scale(.85); transform-origin: right; }
  .shade { background: linear-gradient(#17171b, #0c0c0e); }
  .n-card { background: rgba(38,38,44,.9); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .n-card .h { font-size: 10.5px; color: var(--text-3); display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .n-card .t { font-weight: 700; font-size: 13px; } .n-card .s { font-size: 12px; color: var(--text-2); }
  .n-card .a { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .n-card .a span { padding: 5px 10px; border-radius: 6px; background: var(--surface-2); font-size: 11px; font-weight: 700; }
  .n-card .a span.p { background: var(--signal); color: var(--signal-ink); }
</style>
